name: ci

on:
  push:
  pull_request:

# A result in this repository is a claim, and a claim that cannot be
# regenerated is an anecdote. So the pipeline does not merely lint: it runs a
# real end-to-end measurement on synthetic shards on every push, which is the
# job that would have caught both bugs found while building this.

jobs:
  kernel:
    name: rust kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --manifest-path kernel/Cargo.toml --check
      - name: lint
        run: cargo clippy --manifest-path kernel/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path kernel/Cargo.toml --release

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install
        # Pinned: ruff's default rule set widens between releases, so an
        # unpinned linter fails the build on code nobody touched.
        run: python -m pip install --quiet pyyaml ruff==0.17.1
      - name: lint
        run: ruff check python tools cloud
      - name: runtime tests
        run: python -m unittest discover -s python/tests -v
      - name: cloud adapter tests
        run: python -m unittest discover -s cloud/tests -v

  end-to-end:
    name: synthetic end to end
    runs-on: ubuntu-latest
    needs: [kernel, python]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install --quiet pyyaml
      - name: build kernel
        run: cargo build --manifest-path kernel/Cargo.toml --release
      - name: measure synthetic shards
        run: python tools/check_synthetic.py
